[package]
name = "mango-monitor-ripple"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
