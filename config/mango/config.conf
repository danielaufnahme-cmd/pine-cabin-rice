# ~/.config/mango/config.conf -- MangoWM (mangowc 0.18.4) session on Fedora 44
#
# Picked at SDDM as "Mango" next to "Plasma". Syntax: /etc/mango/config.toml
# (package example) + https://github.com/mangowm/mango/tree/0.18.4/docs.
# Check without starting mango:   mango -c ~/.config/mango/config.conf -p
# Saved changes are hot-reloaded (auto_reload_config=1); SUPER+CTRL+ALT+R reloads by hand.
#
# Keybinds are ported from the old Hyprland rice (Arch USB backup keybind.lua,
# 101 binds) and the newer CachyOS caelestia config (preferred where they differ).
# Binds that need Hyprland-only tools are kept below as "# not ported: <reason>".

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
# Dolphin and other KDE apps outside Plasma: use the KDE platform theme so they
# keep the Breeze style, colours and icons from kdeglobals.
env=QT_QPA_PLATFORMTHEME,kde
env=XCURSOR_SIZE,24
env=XCURSOR_THEME,breeze_cursors
# X11 apps (Steam...): this mangowc build has no Xwayland, so xwayland-satellite
# serves display :11 (not :0/:1, which Plasma's own Xwayland uses).
env=DISPLAY,:11

# ---------------------------------------------------------------------------
# Autostart (exec_once = once at login; exec = on every config reload)
# ---------------------------------------------------------------------------
exec_once=/home/daniel/.local/bin/mango-autostart xwayland-satellite :11
# D-Bus / systemd --user activated apps from Mango need DISPLAY too (Plasma sets its own at login)
exec_once=/home/daniel/.local/bin/mango-autostart sh -c 'DISPLAY=:11; export DISPLAY; systemctl --user import-environment DISPLAY; dbus-update-activation-environment DISPLAY'
# exec_once=waybar  # disabled by MangoWM Mod: its bar starts from mango-mod.conf
# mako's D-Bus autostart is disabled for this user (so it can't grab KDE's
# notifications), so it has to be started here.
exec_once=mako
# exec_once=swaybg  (wallpaper now set in mango-mod.conf)  -m fill -i /home/daniel/Pictures/wallpapers/dark-pine-forest-cabin-photo.png
# the tray (waybar) has to exist before nm-applet registers its icon
exec_once=/home/daniel/.local/bin/mango-autostart sh -c 'sleep 2; exec nm-applet --indicator'
exec_once=/home/daniel/.local/bin/mango-autostart /usr/libexec/xdg-desktop-portal-wlr
exec_once=/home/daniel/.local/bin/mango-autostart /usr/libexec/kf6/polkit-kde-authentication-agent-1
# No timeouts: the PC never locks or sleeps on its own. It only locks if you
# suspend it yourself, so it doesn't wake up unlocked.
exec_once=swayidle -w before-sleep 'swaylock -f -c 141815'

# ---------------------------------------------------------------------------
# Look: rounded corners, gaps, thin teal border, blur, soft shadows
# ---------------------------------------------------------------------------
# no effects in this mango build: border_radius=12
# no effects in this mango build: no_radius_when_single=0
border_px=2
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=12
gap_outer_vertical=12
smart_gaps=0
no_border_when_single=0

root_color=0x141815ff
border_color=0x2b352cff
focus_color=0x7f9a6eff
maximized_screen_color=0x7f9a6eff
urgent_color=0xb5574aff
scratchpad_color=0x7f9a6eff
global_color=0xc88a52ff
overlay_color=0x7f9a6eff
drop_color=0xc88a5255
split_color=0xc88a52ff

focused_opacity=1.0
unfocused_opacity=0.94

# no effects in this mango build: blur=1
# no effects in this mango build: blur_layer=1
# no effects in this mango build: blur_optimized=1
# no effects in this mango build: blur_params_num_passes=2
# no effects in this mango build: blur_params_radius=8
# no effects in this mango build: blur_params_noise=0.02
# no effects in this mango build: blur_params_brightness=0.9
# no effects in this mango build: blur_params_contrast=0.9
# no effects in this mango build: blur_params_saturation=1.2

# no effects in this mango build: shadows=1
# no effects in this mango build: layer_shadows=0
# no effects in this mango build: shadow_only_floating=1
# no effects in this mango build: shadows_size=14
# no effects in this mango build: shadows_blur=18
# no effects in this mango build: shadows_position_x=0
# no effects in this mango build: shadows_position_y=4
# no effects in this mango build: shadows_color=0x00000088

# Fast animations (150-300 ms)
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.85
zoom_end_ratio=0.9
fade_in_begin_opacity=0.4
fade_out_begin_opacity=0.8
animation_duration_move=220
animation_duration_open=220
animation_duration_tag=250
animation_duration_close=180
animation_duration_focus=0
animation_curve_open=0.22,1,0.36,1
animation_curve_move=0.22,1,0.36,1
animation_curve_tag=0.22,1,0.36,1
animation_curve_close=0.4,0,1,1
animation_curve_focus=0.22,1,0.36,1
animation_curve_opacity_fade_out=0.4,0,1,1
animation_curve_opacity_fade_in=0.22,1,0.36,1

# ---------------------------------------------------------------------------
# Layout / tags / behaviour
# ---------------------------------------------------------------------------
# 10 tags so SUPER+0 is a real "workspace 10" (mango allows 1-31, default 9)
tag_num=10
dwindle_split_ratio=0.5
dwindle_preserve_split=1
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.7
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
focus_on_activate=1
enable_floating_snap=1
drag_tile_to_tile=1
cursor_size=24
cursor_theme=breeze_cursors
auto_reload_config=1

# Keyboard / mouse
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us
mouse_natural_scrolling=0

# ---------------------------------------------------------------------------
# Rules
# ---------------------------------------------------------------------------
# Hyprland-like dwindle tiling on every tag
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle
tag_rule=id:10,layout_name:dwindle

# Dropdown terminal (SUPER+Return)
window_rule=is_named_scratchpad:1,width:0.8,height:0.6,offset_y:-60,app_id:^dropterm$
# Small utility windows float
window_rule=is_floating:1,width:900,height:600,app_id:^(org\.pulseaudio\.pavucontrol|nm-connection-editor)$
window_rule=is_floating:1,app_id:^org\.kde\.polkit-kde-authentication-agent-1$
# Zen is see-through (zen.widget.linux.transparency): blur what shows behind it.
# Opacity <1 makes Mango ignore the opaque region Firefox reports, so the blur is drawn.
window_rule=focused_opacity:0.99,app_id:^app\.zen_browser\.zen$

# rofi covers the whole screen as a click-to-close backdrop: dim it, don't blur it
layer_rule=animation_type_open:fade,animation_type_close:fade,layer_name:rofi
# slurp's selection layer: no animation/blur, so it never ends up in screenshots
layer_rule=no_animation:1,layer_name:selection
# mango-ripple focus-wave overlay: no blur / zoom animation, so it stays fast
layer_rule=no_animation:1,layer_name:mango-ripple

# ---------------------------------------------------------------------------
# Keybinds
# ---------------------------------------------------------------------------
# --- Apps ---
bind=SUPER,g,spawn,kitty
bind=SUPER,t,spawn,kitty
bind=SUPER,e,spawn,dolphin
bind=SUPER+SHIFT,b,spawn,flatpak run app.zen_browser.zen
# not ported: SUPER+C code editor -- neither codium nor code is installed
# bind=SUPER,c,spawn,codium
bind=SUPER,space,spawn_shell,pkill -x rofi || rofi -show drun -theme-str 'window { background-color: #00000000; }'
bind=SUPER,Return,toggle_named_scratchpad,dropterm,none,kitty --class dropterm
bind=CTRL+ALT,v,spawn,pavucontrol
# not ported: SUPER+S Steam, SUPER+M quodlibet, SUPER+V vlc -- not installed
# (SUPER+S is the special-tag toggle below, as on CachyOS)

# --- Lock / session ---
bind=SUPER,l,spawn,swaylock -f -c 141815
bind=CTRL+ALT,Delete,spawn_shell,mangonag -t warning -m 'Log out of Mango?' -Z 'Log out' 'mmsg dispatch quit'
bind=SUPER+CTRL+ALT,r,reload_config
# not ported: SUPER+SHIFT+L sleep -- the PC is meant to never sleep; suspend from SDDM/systemctl if needed

# --- Dictation (same keys as on KDE) ---
bind=SUPER,b,spawn_shell,$HOME/.local/bin/voxrec toggle
bind=SUPER+SHIFT,d,spawn_shell,$HOME/.local/bin/voxrec cancel

# --- Screenshots (PNG to ~/Pictures/Screenshots + clipboard) ---
bind=SUPER+SHIFT,s,spawn_shell,$HOME/.local/bin/mango-screenshot region
bind=NONE,Print,spawn_shell,$HOME/.local/bin/mango-screenshot region
bind=SUPER+SHIFT+ALT,s,spawn_shell,$HOME/.local/bin/mango-screenshot region
bind=SUPER+SHIFT,p,spawn_shell,$HOME/.local/bin/mango-screenshot full
bind=SUPER,Print,spawn_shell,$HOME/.local/bin/mango-screenshot full
# not ported: SUPER+A screenshot + annotate -- satty/swappy not installed

# --- Windows ---
bind=SUPER,q,killclient
bind=SUPER+SHIFT,q,killclient,force
bind=SUPER,w,spawn,flatpak run app.zen_browser.zen
# SUPER+H: toggle floating like Hyprland -- a window that starts floating is
# sized to 60% of its monitor and centred; pressing again tiles it.
bind=SUPER,h,spawn_shell,$HOME/.local/bin/mango-float-toggle
bind=SUPER+ALT,space,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER+ALT,f,togglemaximizescreen
bind=SUPER,p,toggleglobal
bind=SUPER+CTRL,backslash,centerwin

# focus
bind=SUPER,Left,spawn_shell,$HOME/.local/bin/mango-focusdir left
bind=SUPER,Right,spawn_shell,$HOME/.local/bin/mango-focusdir right
bind=SUPER,Up,spawn_shell,$HOME/.local/bin/mango-focusdir up
bind=SUPER,Down,spawn_shell,$HOME/.local/bin/mango-focusdir down
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# move / swap (CachyOS: SUPER+SHIFT+arrows)
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# resize (CachyOS: SUPER+ALT+arrows, SUPER+-/=, SUPER+SHIFT+-/=)
bind=SUPER+ALT,Left,resizewin,-30,+0
bind=SUPER+ALT,Right,resizewin,+30,+0
bind=SUPER+ALT,Up,resizewin,+0,-30
bind=SUPER+ALT,Down,resizewin,+0,+30
bind=SUPER,minus,resizewin,-30,+0
bind=SUPER,equal,resizewin,+30,+0
bind=SUPER+SHIFT,minus,resizewin,+0,-30
bind=SUPER+SHIFT,equal,resizewin,+0,+30

# resize mode: SUPER+X, then arrows; Esc / Return / SUPER+X leave it
bind=SUPER,x,setkeymode,resize

# mouse: SUPER+left drag moves, SUPER+right drag resizes
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --- Tags (Hyprland workspaces) ---
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10

# next / previous tag
bind=SUPER+CTRL,Right,viewtoright
bind=SUPER+CTRL,Left,viewtoleft
bind=SUPER,Page_Down,viewtoright
bind=SUPER,Page_Up,viewtoleft
# next / previous occupied tag
bind=SUPER,Tab,viewtoright_have_client
bind=SUPER+SHIFT,Tab,viewtoleft_have_client
# empty tag next to this one
bind=SUPER+CTRL,Down,view_insert,next
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

# move window to next / previous tag
bind=SUPER+CTRL+ALT,Right,tagtoright
bind=SUPER+CTRL+ALT,Left,tagtoleft
bind=SUPER+CTRL+SHIFT,Right,tagtoright
bind=SUPER+CTRL+SHIFT,Left,tagtoleft
bind=SUPER+ALT,Page_Down,tagtoright
bind=SUPER+ALT,Page_Up,tagtoleft

# special tag (Hyprland special workspace) -- CachyOS binds
bind=SUPER,s,toggle_special_tag
bind=SUPER+ALT,s,tag_special_tag
bind=SUPER+CTRL+SHIFT,Up,tag_special_tag
bind=SUPER+CTRL+SHIFT,Down,tag_special_tag

# --- Media / volume (playerctl, wpctl) ---
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=SUPER+CTRL,space,spawn,playerctl play-pause
bindl=SUPER+CTRL,equal,spawn,playerctl next
bindl=SUPER+CTRL,minus,spawn,playerctl previous
bindl=SUPER+CTRL,BackSpace,spawn,playerctl stop
bindl=NONE,F9,spawn,playerctl --player=firefox,%any play-pause
bindl=NONE,F7,spawn,playerctl --player=firefox,%any position 10-
bindl=NONE,F8,spawn,playerctl --player=firefox,%any position 10+
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=SUPER+SHIFT,m,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --- Not ported (Hyprland-only tools) ---
# not ported: SUPER+T/SHIFT+T Noctalia settings / Rice Settings -- Noctalia + rice-settings.py are Hyprland rice tools
# not ported: SUPER+SHIFT+B Bluetooth panel -- Noctalia panel (SUPER+SHIFT+B is the browser here)
# not ported: SUPER+J / SUPER+SHIFT+X / SUPER+SHIFT+J -- JARVIS and Vector HUDs are quickshell/Hyprland overlays
# not ported: SUPER+H / SUPER+K cheat sheet & keys panel -- Hyprland cheat-sheet tool
# not ported: SUPER+ALT+G Ghostty cursor trail -- Ghostty-only, Ghostty not used here
# not ported: SUPER+ALT+W / ALT+SHIFT+W / ALT+R / ALT+SPACE wallpaper switcher & picker -- Hyprland/Noctalia scripts
# not ported: CTRL+H/J/K/L vim arrows -- needs Hyprland send_shortcut; mango has no key-resend dispatcher
# not ported: F6 AI rename -- ~/.local/bin/ai-rename is not on this PC
# not ported: SUPER+SHIFT+U switch user -- /srv/shared/vector-desktop/bin/switch-user is not on this PC
# not ported: caelestia binds (sidebar SUPER+N, clipboard SUPER+V, emoji SUPER+., session menu, notif clear, record, colour picker) -- caelestia/quickshell only
# not ported: window groups (SUPER+comma, SUPER+U, CTRL+ALT+Tab) -- Hyprland groups

# ---------------------------------------------------------------------------
# Resize mode (entered with SUPER+X)
# ---------------------------------------------------------------------------
key_mode=resize
bind=NONE,Left,resizewin,-30,+0
bind=NONE,Right,resizewin,+30,+0
bind=NONE,Up,resizewin,+0,-30
bind=NONE,Down,resizewin,+0,+30
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default
bind=SUPER,x,setkeymode,default

# MangoWM Mod: keep this line last so its settings take precedence
source=./mango-mod.conf

# Dexa
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-pill
layer_rule=no_animation:1,layer_name:dexa-agent-cursor
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-hud
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-appbar
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-appbar-corner
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-appbar-drawer
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-hot-corner
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-answer
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-control-chip
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-cores
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-dock
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-docprogress
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-draft
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-ghost-overlay
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-meeting
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-ownscreen
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-reading
# no options left (blur/shadow removed): layer_rule=layer_name:dexa-typein
bind=SUPER+SHIFT,Escape,spawn,dexactl computer stop
bind=SUPER+CTRL,Escape,spawn,dexactl computer pause
bind=SUPER+ALT,Escape,spawn,dexactl computer resume
exec_once=/usr/libexec/at-spi-bus-launcher --launch-immediately --a11y=1
exec_once=/home/daniel/.local/bin/mango-autostart sh -c 'systemctl --user import-environment DBUS_SESSION_BUS_ADDRESS'

# Games: let fullscreen games skip waiting for the screen refresh (less mouse lag)
allow_tearing=1
# Mouse: flat = no acceleration (1:1 hand movement, better for games)
mouse_accel_profile=1
mouse_accel_speed=0
