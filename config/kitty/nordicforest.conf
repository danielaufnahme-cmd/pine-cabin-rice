# NordicForest kitty theme (KDE Plasma session only).
# Loaded via desktop-KDE.conf <- "globinclude desktop-${XDG_CURRENT_DESKTOP}.conf"
# in kitty.conf, so Hyprland (XDG_CURRENT_DESKTOP=Hyprland) keeps noctalia.

font_family      family="MonaspiceNe Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width 10
cursor_shape         beam
cursor_trail         0

foreground            #dce9f0
background            #1b2436
selection_foreground  #1b2436
selection_background  #aecfde
cursor                #bbdfed
cursor_text_color     #1b2436
url_color             #6d97ae
active_border_color   #6d97ae
inactive_border_color #27344c

active_tab_foreground   #1b2436
active_tab_background   #aecfde
inactive_tab_foreground #8ea9bb
inactive_tab_background #222c40
tab_bar_background      #1b2436

# normal: navy, rose, sage, sand, steel, slate-teal, ice, text
color0  #27344c
color1  #d08a8a
color2  #9fc4a8
color3  #d8b98a
color4  #6d97ae
color5  #8fb3c7
color6  #88c0c8
color7  #dce9f0
# bright
color8  #425668
color9  #e0a0a0
color10 #b4d6bc
color11 #e6cba0
color12 #aecfde
color13 #a9c8d9
color14 #bbdfed
color15 #f1f7fa
