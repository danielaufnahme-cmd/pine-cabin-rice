shell /usr/bin/fish
include themes/pine-cabin.conf

# Hide the KDE/Wayland server-side title bar (minimize/maximize/close buttons).

#backgound


# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

#backgound stuff
background_opacity 0.85
dynamic_background_opacity yes

# Do not restore the last window size/state. Kitty saved "maximized" and every
# new window opened maximized over the tiling layout; Hyprland sizes it instead.
remember_window_size no

# Zoom text with Ctrl +/-, reset with Ctrl 0
map ctrl+equal       change_font_size all +1.0
map ctrl+plus        change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0

# Never auto-hide the mouse pointer (default hides it after 3s; it can stay hidden on Wayland)
mouse_hide_wait 0

# 2026-10-25: no beep when a terminal rings the bell (Claude Code does on finish); notifications stay.
enable_audio_bell no

# 2026-10-31: per-desktop overrides; matches desktop-KDE.conf only under Plasma.
# No file for Hyprland, so the glob matches nothing there (no error).
globinclude desktop-${XDG_CURRENT_DESKTOP}.conf
