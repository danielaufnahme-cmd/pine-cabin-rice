# PineCabin kitty theme (KDE Plasma session only).
# Loaded via desktop-KDE.conf <- "globinclude desktop-${XDG_CURRENT_DESKTOP}.conf"
# in kitty.conf. Colours are identical to themes/pine-cabin.conf (Mango rice),
# so kitty looks the same on both desktops.

font_family      family="MonaspiceNe Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width 10
cursor_shape         beam
cursor_trail         0

foreground            #c8d0c2
background            #141815
selection_foreground  #c8d0c2
selection_background  #3d4a3c
cursor                #c88a52
cursor_text_color     #141815
url_color             #7f9a6e
active_border_color   #c88a52
inactive_border_color #2b352c
bell_border_color     #b5574a

active_tab_foreground   #141815
active_tab_background   #c88a52
inactive_tab_foreground #869180
inactive_tab_background #1c221d
tab_bar_background      #141815

# black, red, green, yellow, blue, magenta, cyan, white
color0  #1c221d
color1  #b5574a
color2  #7f9a6e
color3  #c88a52
color4  #6f8a8c
color5  #9a7a6a
color6  #7a9a8a
color7  #c8d0c2
# bright
color8  #4a5748
color9  #c8695b
color10 #95b082
color11 #d9a26e
color12 #87a2a3
color13 #b0907f
color14 #93b3a2
color15 #e2e7dd
