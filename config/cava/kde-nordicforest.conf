# cava config for the KDE Plasma visualizers (desktop + dock).
# Read by ~/.local/share/kde-cava/kde-cava.py; not used by Hyprland.

[general]
framerate = 60
autosens = 1
bars = 128
lower_cutoff_freq = 50
higher_cutoff_freq = 12000
# stop FFT work after 2 s of silence; the helper treats a stalled stream as silence
sleep_timer = 2

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = stereo
mono_option = average

[color]
theme = 'kde-pinecabin'

[smoothing]
noise_reduction = 77
monstercat = 1
waves = 0
